---
- name: Install Desktop Web Browsers Cross-Platform
  hosts: localhost
  become: true

  vars:
    real_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) | default(lookup('env', 'USER')) }}"
    real_user_home: "{{ ansible_facts['env']['HOME'] if ansible_facts['env']['SUDO_USER'] is not defined else '/home/' + ansible_facts['env']['SUDO_USER'] }}"

  tasks:
    # ----------------------------------------------------
    # 1. PLATFORM INDEPENDENT / STANDARD REPO BROWSERS
    # ----------------------------------------------------
    - name: Install Firefox, Epiphany, Falkon, and Tor Browser via native package manager
      ansible.builtin.package:
        name:
          - firefox
          - epiphany
          - falkon
          - torbrowser-launcher
        state: present
      ignore_errors: true

    # ----------------------------------------------------
    # 2. FEDORA CONFIGURATIONS & INSTALLATIONS
    # ----------------------------------------------------
    - name: Configure and install third-party browsers on Fedora
      when: ansible_facts['os_family'] == "RedHat" or ansible_facts['distribution'] == "Fedora"
      block:
        - name: Enable Google Chrome repository (Fedora)
          ansible.builtin.yum_repository:
            name: google-chrome
            description: google-chrome
            baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
            gpgkey: https://dl.google.com/linux/linux_signing_key.pub
            gpgcheck: true
            enabled: true

        - name: Add Brave Browser repository (Fedora)
          ansible.builtin.get_url:
            url: https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
            dest: /etc/yum.repos.d/brave-browser.repo
            mode: '0644'

        - name: Add Opera Browser repository (Fedora)
          ansible.builtin.yum_repository:
            name: opera
            description: Opera packages
            baseurl: https://rpm.opera.com/rpm
            gpgkey: https://rpm.opera.com/rpmrepo.key
            gpgcheck: true

        - name: Add Microsoft Edge repository (Fedora)
          ansible.builtin.yum_repository:
            name: microsoft-edge
            description: Microsoft Edge
            baseurl: https://packages.microsoft.com/yumrepos/edge
            gpgkey: https://packages.microsoft.com/keys/microsoft.asc
            gpgcheck: true

        - name: Add Vivaldi repository (Fedora)
          ansible.builtin.yum_repository:
            name: vivaldi
            description: Vivaldi Browser
            baseurl: https://repo.vivaldi.com/archive/rpm/$basearch
            gpgkey: https://repo.vivaldi.com/archive/linux_signing_key.pub
            gpgcheck: true

        - name: Add LibreWolf repository (Fedora)
          ansible.builtin.get_url:
            url: https://repo.librewolf.net/librewolf.repo
            dest: /etc/yum.repos.d/librewolf.repo
            mode: '0644'
            force: yes

        - name: Install Chrome, Brave, Opera, Edge, Vivaldi, and LibreWolf on Fedora
          ansible.builtin.dnf:
            name:
              - google-chrome-stable
              - brave-browser
              - opera-stable
              - microsoft-edge-stable
              - vivaldi-stable
              - librewolf
            state: present
            update_cache: yes

    # ----------------------------------------------------
    # 3. DEBIAN / UBUNTU CONFIGURATIONS & INSTALLATIONS
    # ----------------------------------------------------
    - name: Configure and install third-party browsers on Debian/Ubuntu
      when: ansible_facts['os_family'] == "Debian"
      block:
        - name: Ensure prerequisites for custom apt repos are installed
          ansible.builtin.apt:
            name:
              - curl
              - gpg
              - software-properties-common
            state: present
            update_cache: yes

        # Google Chrome setup
        - name: Add Google Chrome GPG key (Debian)
          ansible.builtin.get_url:
            url: https://dl.google.com/linux/linux_signing_key.pub
            dest: /etc/apt/keyrings/google-chrome.asc
            mode: '0644'

        - name: Add Google Chrome repository (Debian)
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.asc] http://dl.google.com/linux/chrome/deb/ stable main"
            state: present
            filename: google-chrome

        # Brave Browser setup
        - name: Add Brave GPG key (Debian)
          ansible.builtin.get_url:
            url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
            dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
            mode: '0644'

        - name: Add Brave repository (Debian)
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
            state: present
            filename: brave-browser

        # Opera Browser setup
        - name: Add Opera GPG key (Debian)
          ansible.builtin.get_url:
            url: https://deb.opera.com/archive.key
            dest: /etc/apt/keyrings/opera.asc
            mode: '0644'

        - name: Add Opera repository (Debian)
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/opera.asc] https://deb.opera.com/opera-stable/ stable non-free"
            state: present
            filename: opera-stable

        # Microsoft Edge setup
        - name: Add Microsoft Edge GPG key (Debian)
          ansible.builtin.get_url:
            url: https://packages.microsoft.com/keys/microsoft.asc
            dest: /etc/apt/keyrings/microsoft-edge.asc
            mode: '0644'

        - name: Add Microsoft Edge repository (Debian)
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft-edge.asc] https://packages.microsoft.com/repos/edge stable main"
            state: present
            filename: microsoft-edge

        # Vivaldi setup
        - name: Add Vivaldi GPG key (Debian)
          ansible.builtin.get_url:
            url: https://repo.vivaldi.com/archive/linux_signing_key.pub
            dest: /etc/apt/keyrings/vivaldi.asc
            mode: '0644'

        - name: Add Vivaldi repository (Debian)
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/vivaldi.asc] https://repo.vivaldi.com/archive/deb/ stable main"
            state: present
            filename: vivaldi

        # LibreWolf setup
        - name: Add LibreWolf GPG key (Debian)
          ansible.builtin.get_url:
            url: https://repo.librewolf.net/pubkey.gpg
            dest: /etc/apt/keyrings/librewolf.gpg
            mode: '0644'

        - name: Add LibreWolf repository (Debian)
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/librewolf.gpg] http://deb.librewolf.net {{ ansible_facts['distribution_release'] }} main"
            state: present
            filename: librewolf

        - name: Install Chrome, Brave, Opera, Edge, Vivaldi, and LibreWolf on Debian/Ubuntu
          ansible.builtin.apt:
            name:
              - google-chrome-stable
              - brave-browser
              - opera-stable
              - microsoft-edge-stable
              - vivaldi-stable
              - librewolf
            state: present
            update_cache: yes

    # ----------------------------------------------------
    # 4. ZEN BROWSER INSTALLATION (CROSS-PLATFORM)
    # ----------------------------------------------------
    - name: Install Zen Browser via release tarball
      block:
        - name: Create directory for Zen Browser
          ansible.builtin.file:
            path: /opt/zen-browser
            state: directory
            mode: '0755'

        - name: Download and unarchive Zen Browser
          ansible.builtin.unarchive:
            src: https://github.com/zen-browser/desktop/releases/latest/download/zen.linux-x86_64.tar.xz
            dest: /opt/zen-browser
            remote_src: yes
            extra_opts:
              - --strip-components=1
          ignore_errors: true

        - name: Symlink Zen Browser executable
          ansible.builtin.file:
            src: /opt/zen-browser/zen
            dest: /usr/local/bin/zen-browser
            state: link
          ignore_errors: true

        - name: Create desktop shortcut for Zen Browser
          ansible.builtin.copy:
            dest: /usr/share/applications/zen-browser.desktop
            mode: '0644'
            content: |
              [Desktop Entry]
              Version=1.0
              Name=Zen Browser
              Comment=Experience tranquility while browsing the web without compromising privacy.
              Exec=/usr/local/bin/zen-browser %u
              Terminal=false
              Type=Application
              Icon=/opt/zen-browser/browser/chrome/icons/default/default128.png
              Categories=Network;WebBrowser;
              MimeType=text/html;text/xml;application/xhtml+xml;application/xml;application/vnd.mozilla.xul+xml;application/rss+xml;application/rdf+xml;x-scheme-handler/http;x-scheme-handler/https;
          ignore_errors: true

    # ----------------------------------------------------
    # 5. ALPINE LINUX NOTEWORTHY DETAILS
    # ----------------------------------------------------
    - name: Notify/Install missing browsers on Alpine
      when: ansible_facts['os_family'] == "Alpine"
      block:
        - name: Update Alpine repository index
          community.general.apk:
            update_cache: yes

        # Note: Chromium is used on Alpine as proprietary binaries like official Google Chrome, 
        # Brave, Opera, and Microsoft Edge do not offer native glibc-static/musl compiler versions for pure apk architectures.
        - name: Install alternative Chromium engine on Alpine
          community.general.apk:
            name:
              - chromium
            state: present

        - name: Display warning about proprietary browsers on Alpine
          ansible.builtin.debug:
            msg: "Notice: Google Chrome, Brave, Opera, and Microsoft Edge do not natively support Alpine (musl libc). Installed Open-Source 'Chromium' as the structural alternative."

    # ----------------------------------------------------
    # 6. BUKUBROW NATIVE HOST & EXTENSION INTEGRATION
    # ----------------------------------------------------
    - name: Setup Buku and Bukubrow Native Messaging Host
      block:
        - name: Ensure Buku bookmark manager CLI is installed
          ansible.builtin.package:
            name: buku
            state: present
          ignore_errors: true

        - name: Download Bukubrow Native Messaging Host binary
          ansible.builtin.get_url:
            url: "https://github.com/samhh/bukubrow-host/releases/download/v5.4.0/bukubrow-linux-amd64"
            dest: "/usr/local/bin/bukubrow"
            mode: '0755'
            owner: root
            group: root

        - name: Ensure system-wide native messaging hosts directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop:
            - /etc/opt/chrome/native-messaging-hosts
            - /etc/chromium/native-messaging-hosts
            - /etc/brave/native-messaging-hosts
            - /etc/opt/edge/native-messaging-hosts
            - /usr/lib64/mozilla/native-messaging-hosts
            - /usr/lib/mozilla/native-messaging-hosts

        - name: Deploy Bukubrow native messaging manifest for Chromium browsers
          ansible.builtin.copy:
            dest: "{{ item }}/com.samhh.bukubrow.json"
            owner: root
            group: root
            mode: '0644'
            content: |
              {
                "name": "com.samhh.bukubrow",
                "description": "Bukubrow is a WebExtension for Buku, a command-line bookmark manager. This is the corresponding host that facilitates interfacing with the Buku database via native messaging.",
                "path": "/usr/local/bin/bukubrow",
                "type": "stdio",
                "allowed_origins": [
                  "chrome-extension://ghniladkapjacfajiooekgkfopkjblpn/"
                ]
              }
          loop:
            - /etc/opt/chrome/native-messaging-hosts
            - /etc/chromium/native-messaging-hosts
            - /etc/brave/native-messaging-hosts
            - /etc/opt/edge/native-messaging-hosts

        - name: Deploy Bukubrow native messaging manifest for Mozilla browsers
          ansible.builtin.copy:
            dest: "{{ item }}/com.samhh.bukubrow.json"
            owner: root
            group: root
            mode: '0644'
            content: |
              {
                "name": "com.samhh.bukubrow",
                "description": "Bukubrow is a WebExtension for Buku, a command-line bookmark manager. This is the corresponding host that facilitates interfacing with the Buku database via native messaging.",
                "path": "/usr/local/bin/bukubrow",
                "type": "stdio",
                "allowed_extensions": [
                  "bukubrow@samhh.com"
                ]
              }
          loop:
            - /usr/lib64/mozilla/native-messaging-hosts
            - /usr/lib/mozilla/native-messaging-hosts

        - name: Ensure browser external extension directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop:
            - /usr/share/google-chrome/extensions
            - /usr/share/chromium/extensions
            - /opt/google/chrome/extensions

        - name: Configure automatic installation of Bukubrow WebExtension in Chromium browsers
          ansible.builtin.copy:
            dest: "{{ item }}/ghniladkapjacfajiooekgkfopkjblpn.json"
            owner: root
            group: root
            mode: '0644'
            content: |
              {
                "external_update_url": "https://clients2.google.com/service/update2/crx"
              }
          loop:
            - /usr/share/google-chrome/extensions
            - /usr/share/chromium/extensions
            - /opt/google/chrome/extensions

        - name: Ensure user-level native messaging directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ real_user }}"
            mode: '0755'
          loop:
            - "{{ real_user_home }}/.mozilla/native-messaging-hosts"
            - "{{ real_user_home }}/.config/google-chrome/NativeMessagingHosts"
            - "{{ real_user_home }}/.config/chromium/NativeMessagingHosts"
            - "{{ real_user_home }}/.config/BraveSoftware/Brave-Browser/NativeMessagingHosts"
          ignore_errors: true

        - name: Deploy Chromium native messaging manifest to user profile
          ansible.builtin.copy:
            src: "/etc/chromium/native-messaging-hosts/com.samhh.bukubrow.json"
            dest: "{{ item }}/com.samhh.bukubrow.json"
            owner: "{{ real_user }}"
            mode: '0644'
            remote_src: true
          loop:
            - "{{ real_user_home }}/.config/google-chrome/NativeMessagingHosts"
            - "{{ real_user_home }}/.config/chromium/NativeMessagingHosts"
            - "{{ real_user_home }}/.config/BraveSoftware/Brave-Browser/NativeMessagingHosts"
          ignore_errors: true

        - name: Deploy Firefox native messaging manifest to user profile
          ansible.builtin.copy:
            src: "/usr/lib64/mozilla/native-messaging-hosts/com.samhh.bukubrow.json"
            dest: "{{ real_user_home }}/.mozilla/native-messaging-hosts/com.samhh.bukubrow.json"
            owner: "{{ real_user }}"
            mode: '0644'
            remote_src: true
          ignore_errors: true

        - name: Display Bukubrow setup summary
          ansible.builtin.debug:
            msg:
              - "=========================================================================="
              - " Bukubrow Native Messaging Host & Extension Configuration Complete!"
              - "=========================================================================="
              - " Native Host Binary: /usr/local/bin/bukubrow"
              - " Chrome Web Store Extension ID: ghniladkapjacfajiooekgkfopkjblpn"
              - " Manifests registered for: Chrome, Chromium, Brave, Edge, Firefox, LibreWolf"
              - " WebExtension will auto-install on Chromium browsers via external extensions."
              - " For Firefox, install from: https://addons.mozilla.org/en-US/firefox/addon/bukubrow/"
              - "=========================================================================="


