---
- name: Ensure Progsativos directory exists
  ansible.builtin.file:
    path: "{{ progsativos_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ java_target_user }}"
    group: "{{ java_target_user }}"
  become: yes

- name: Ensure Java parent installation directory exists
  ansible.builtin.file:
    path: "{{ java_install_parent_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ java_target_user }}"
    group: "{{ java_target_user }}"
  become: yes

- name: Check if Temurin JDK is already installed
  ansible.builtin.stat:
    path: "{{ java_install_dir }}"
  register: java_jdk_dir

- name: Download Temurin JDK tarball
  ansible.builtin.get_url:
    url: "{{ java_download_url }}"
    dest: "/tmp/{{ java_tarball_filename }}"
    mode: '0644'
    timeout: 300
  register: java_download
  until: java_download is succeeded
  retries: 3
  delay: 5
  when: not java_jdk_dir.stat.exists

- name: Extract Temurin JDK
  ansible.builtin.unarchive:
    src: "/tmp/{{ java_tarball_filename }}"
    dest: "{{ java_install_parent_dir }}"
    remote_src: yes
    creates: "{{ java_install_dir }}"
    owner: "{{ java_target_user }}"
    group: "{{ java_target_user }}"
  when: not java_jdk_dir.stat.exists

- name: Clean up Temurin JDK tarball
  ansible.builtin.file:
    path: "/tmp/{{ java_tarball_filename }}"
    state: absent
  when: not java_jdk_dir.stat.exists


- name: Set facts for Java binaries
  ansible.builtin.set_fact:
    java_bin: "{{ java_install_dir }}/bin/java"
    javac_bin: "{{ java_install_dir }}/bin/javac"
    jar_bin: "{{ java_install_dir }}/bin/jar"

- name: Register and select java alternative
  community.general.alternatives:
    name: java
    link: /usr/bin/java
    path: "{{ java_bin }}"
    priority: 100
  become: yes

- name: Register and select javac alternative (with jar follower)
  community.general.alternatives:
    name: javac
    link: /usr/bin/javac
    path: "{{ javac_bin }}"
    priority: 100
    subcommands:
      - name: jar
        link: /usr/bin/jar
        path: "{{ jar_bin }}"
  become: yes

- name: Configure JAVA_HOME environment variable
  ansible.builtin.template:
    src: java_env.sh.j2
    dest: /etc/profile.d/java.sh
    mode: '0644'
  become: yes

