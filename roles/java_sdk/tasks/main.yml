---
- name: Ensure Progsativos directory exists
  ansible.builtin.file:
    path: "{{ progsativos_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ java_target_user }}"
    group: "{{ java_target_user }}"
  become: yes

- name: Ensure Java parent installation directory exists
  ansible.builtin.file:
    path: "{{ java_install_parent_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ java_target_user }}"
    group: "{{ java_target_user }}"
  become: yes

- name: Download and extract Temurin JDK
  ansible.builtin.unarchive:
    src: "{{ java_download_url }}"
    dest: "{{ java_install_parent_dir }}"
    remote_src: yes
    creates: "{{ java_install_dir }}"
    owner: "{{ java_target_user }}"
    group: "{{ java_target_user }}"

- name: Set facts for Java binaries
  ansible.builtin.set_fact:
    java_bin: "{{ java_install_dir }}/bin/java"
    javac_bin: "{{ java_install_dir }}/bin/javac"
    jar_bin: "{{ java_install_dir }}/bin/jar"

- name: Register and select java alternative
  community.general.alternatives:
    name: java
    link: /usr/bin/java
    path: "{{ java_bin }}"
    priority: 100
  become: yes

- name: Register and select javac alternative (with jar follower)
  community.general.alternatives:
    name: javac
    link: /usr/bin/javac
    path: "{{ javac_bin }}"
    priority: 100
    subcommands:
      - name: jar
        link: /usr/bin/jar
        path: "{{ jar_bin }}"
  become: yes

- name: Configure JAVA_HOME environment variable
  ansible.builtin.template:
    src: java_env.sh.j2
    dest: /etc/profile.d/java.sh
    mode: '0644'
  become: yes

