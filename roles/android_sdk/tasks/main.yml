---
- name: Ensure Android directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ android_tools_owner }}"
  loop:
    - "{{ android_studio_dir }}"
    - "{{ android_sdk_dir }}"
    - "{{ android_sdk_dir }}/cmdline-tools"

- name: Resolve latest Android Studio URL if set to auto or latest
  block:
    - name: Fetch Android Studio download page
      ansible.builtin.uri:
        url: "https://developer.android.com/studio"
        return_content: yes
      register: android_studio_page
      ignore_errors: true

    - name: Extract latest Linux download URL
      ansible.builtin.set_fact:
        android_studio_scraped_url: "{{ android_studio_page.content | regex_search('https://[^\"]+linux\\.tar\\.gz') }}"
      when:
        - android_studio_page is succeeded
        - android_studio_page.content is defined
  when: android_studio_url == 'auto' or android_studio_version == 'latest'

- name: Determine effective Android Studio download URL
  ansible.builtin.set_fact:
    android_studio_effective_url: "{{ android_studio_scraped_url | default(android_studio_fallback_url) if (android_studio_url == 'auto' or android_studio_version == 'latest') else android_studio_url }}"

- name: Determine tarball filename from URL
  ansible.builtin.set_fact:
    android_studio_tarball_filename: "{{ android_studio_effective_url | basename }}"

- name: Check currently installed Android Studio version tracking file
  ansible.builtin.slurp:
    src: "{{ android_studio_dir }}/.installed_url"
  register: installed_studio_url_file
  ignore_errors: true

- name: Set facts for Android Studio installation state
  ansible.builtin.set_fact:
    installed_studio_url: "{{ installed_studio_url_file.content | b64decode | trim if (installed_studio_url_file.content is defined and installed_studio_url_file.content) else '' }}"

- name: Download and Install Android Studio
  block:
    - name: Download Android Studio tarball
      ansible.builtin.get_url:
        url: "{{ android_studio_effective_url }}"
        dest: "/tmp/{{ android_studio_tarball_filename }}"
        mode: '0644'
        timeout: 600
      register: studio_download
      until: studio_download is succeeded
      retries: 3
      delay: 5

    - name: Ensure target Android Studio installation directory exists
      ansible.builtin.file:
        path: "{{ android_studio_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ android_tools_owner }}"

    - name: Extract Android Studio tarball
      ansible.builtin.unarchive:
        src: "/tmp/{{ android_studio_tarball_filename }}"
        dest: "{{ android_studio_dir }}"
        remote_src: yes
        extra_opts: ["--strip-components=1"]
        owner: "{{ android_tools_owner }}"

    - name: Record installed Android Studio URL
      ansible.builtin.copy:
        content: "{{ android_studio_effective_url }}"
        dest: "{{ android_studio_dir }}/.installed_url"
        mode: '0644'
        owner: "{{ android_tools_owner }}"

    - name: Clean up Android Studio tarball
      ansible.builtin.file:
        path: "/tmp/{{ android_studio_tarball_filename }}"
        state: absent
  when: installed_studio_url != android_studio_effective_url


- name: Check if Android Command Line Tools are already installed
  ansible.builtin.stat:
    path: "{{ android_sdk_dir }}/cmdline-tools/latest/bin/sdkmanager"
  register: sdkmanager_bin

- name: Install Android Command Line Tools
  block:
    - name: Download Command Line Tools zip
      ansible.builtin.get_url:
        url: "{{ android_cmdline_tools_url }}"
        dest: "/tmp/commandlinetools-linux-{{ android_cmdline_tools_version }}_latest.zip"
        mode: '0644'
        timeout: 300
      register: cmdline_download
      until: cmdline_download is succeeded
      retries: 3
      delay: 5

    - name: Extract Command Line Tools
      ansible.builtin.unarchive:
        src: "/tmp/commandlinetools-linux-{{ android_cmdline_tools_version }}_latest.zip"
        dest: "{{ android_sdk_dir }}/cmdline-tools"
        remote_src: yes

    - name: Clean up Command Line Tools zip
      ansible.builtin.file:
        path: "/tmp/commandlinetools-linux-{{ android_cmdline_tools_version }}_latest.zip"
        state: absent

    - name: Move to 'latest' directory structure
      ansible.builtin.command:
        cmd: "mv {{ android_sdk_dir }}/cmdline-tools/cmdline-tools {{ android_sdk_dir }}/cmdline-tools/latest"
      args:
        creates: "{{ android_sdk_dir }}/cmdline-tools/latest"
  when: not sdkmanager_bin.stat.exists


- name: Create Android Environment Configuration
  ansible.builtin.template:
    src: android_env.j2
    dest: "/home/{{ android_tools_owner }}/.bashrc_android"
    mode: '0644'
    owner: "{{ android_tools_owner }}"

- name: Source Android Environment in .bashrc
  ansible.builtin.lineinfile:
    path: "/home/{{ android_tools_owner }}/.bashrc"
    line: "source ~/.bashrc_android"
    state: present
    owner: "{{ android_tools_owner }}"

- name: Accept Android SDK Licenses
  ansible.builtin.shell: |
    yes | {{ android_sdk_dir }}/cmdline-tools/latest/bin/sdkmanager --sdk_root={{ android_sdk_dir }} --licenses
  changed_when: false
  # Ignore errors because it might return 0 even if no licenses were accepted if they are already accepted
  ignore_errors: true

- name: Install Android SDK Packages
  ansible.builtin.shell: |
    {{ android_sdk_dir }}/cmdline-tools/latest/bin/sdkmanager --sdk_root={{ android_sdk_dir }} "{{ item }}"
  loop: "{{ android_sdk_packages }}"
  changed_when: true
  register: sdkmanager_install

- name: Ensure recursive ownership of Android SDK and Studio directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ android_tools_owner }}"
    group: "{{ android_tools_owner }}"
    recurse: yes
  loop:
    - "{{ android_sdk_dir }}"
    - "{{ android_studio_dir }}"

