---
# Configuration for user applications
user_apps_install_dir: "{{ lookup('env', 'HOME') }}/Apps"

# MTP (Media Transfer Protocol) configuration for smartphone & camera file transfers
install_mtp: true

mtp_packages_fedora:
  - libmtp
  - libmtp-examples
  - gvfs-mtp
  - jmtpfs
  - kio-extras
  - android-file-transfer

mtp_packages_debian:
  - libmtp-runtime
  - mtp-tools
  - gvfs-backends
  - jmtpfs
  - kio-extras

mtp_packages_alpine:
  - libmtp
  - gvfs
  - simple-mtpfs

# Telegram configuration
install_telegram: true
telegram_download_url: "https://telegram.org/dl/desktop/linux"
telegram_archive_name: "tsetup.tar.xz"

# User applications packages
user_packages_fedora:
  - gimp
  - blender
  - chromium
  - epiphany
  - firefox

user_packages_debian:
  - gimp
  - blender
  - chromium-browser
  - epiphany-browser
  - firefox-esr

