---
- name: Install AI CLI tools via NPM
  npm:
    name: "{{ item }}"
    global: yes
    state: present
  loop: "{{ ai_npm_packages }}"

- name: Install MCP Server Packages for Gemini CLI
  npm:
    name: "{{ item }}"
    global: yes
    state: present
  loop: "{{ mcp_npm_packages }}"

- name: Install Python AI SDKs (Libraries)
  pip:
    name: "{{ ai_python_libraries }}"
    state: latest
    executable: pip3
    extra_args: "--break-system-packages"

- name: Ensure pipx is ready
  command: pipx ensurepath
  become: no

- name: Install Python AI Apps via pipx
  command: "pipx install {{ item }} --force"
  loop: "{{ ai_python_apps }}"
  become: no
  register: pipx_result
  changed_when: 
    - "'installed package' in pipx_result.stdout or 'upgraded package' in pipx_result.stdout"
    - "'git+' in item or 'installed package' in pipx_result.stdout"
  failed_when: 
    - pipx_result.rc != 0
    - "'already installed' not in pipx_result.stderr"
    - "item != 'open-interpreter'"
    - "'git+' not in item or 'failed' in pipx_result.stderr"

- name: Get the actual user and home directory
  set_fact:
    real_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"
    real_user_home: "{{ ansible_facts['env']['HOME'] if ansible_facts['env']['SUDO_USER'] is not defined else '/home/' + ansible_facts['env']['SUDO_USER'] }}"

- name: Ensure .envs directory exists in user home
  file:
    path: "{{ real_user_home }}/.envs"
    state: directory
    mode: '0755'
    owner: "{{ real_user }}"
  when: install_aider_venv | bool
  become: yes

- name: Create isolated Python virtual environment for Aider (~/.envs/aider)
  command: "python3 -m venv {{ real_user_home }}/.envs/aider"
  args:
    creates: "{{ real_user_home }}/.envs/aider/bin/activate"
  when: install_aider_venv | bool
  become: yes
  become_user: "{{ real_user }}"

- name: Upgrade pip, setuptools, and wheel in Aider virtual environment
  pip:
    name:
      - pip
      - setuptools
      - wheel
    state: latest
    virtualenv: "{{ real_user_home }}/.envs/aider"
  when: install_aider_venv | bool
  become: yes
  become_user: "{{ real_user }}"

- name: Install aider-chat in isolated virtual environment
  pip:
    name: "git+https://github.com/Aider-AI/aider.git"
    state: latest
    virtualenv: "{{ real_user_home }}/.envs/aider"
  when: install_aider_venv | bool
  become: yes
  become_user: "{{ real_user }}"

- name: Create fzl-aider executable command wrapper in /usr/local/bin
  template:
    src: fzl-aider.j2
    dest: /usr/local/bin/fzl-aider
    mode: '0755'
    owner: root
    group: root
  when: install_aider_venv | bool
  become: yes

- name: Ensure agent configuration directories exist in user home
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ real_user }}"
  loop:
    - "{{ real_user_home }}/.gemini"
    - "{{ real_user_home }}/.claude"
    - "{{ real_user_home }}/.config/opencode"
    - "{{ real_user_home }}/.config/shell_gpt"
    - "{{ real_user_home }}/.config/agents"
  become: yes

- name: Configure Tier 1 shared AI environment in ~/.bashrc_ai_tools
  template:
    src: bashrc_ai_tools.j2
    dest: "{{ real_user_home }}/.bashrc_ai_tools"
    mode: '0644'
    owner: "{{ real_user }}"
  become: yes

- name: Source ~/.bashrc_ai_tools in user's ~/.bashrc
  lineinfile:
    path: "{{ real_user_home }}/.bashrc"
    line: "source ~/.bashrc_ai_tools"
    state: present
    create: yes
    owner: "{{ real_user }}"
  become: yes

- name: Configure Tier 2 Universal Agent guidelines (~/.config/agents/AGENTS.md)
  template:
    src: AGENTS.md.j2
    dest: "{{ real_user_home }}/.config/agents/AGENTS.md"
    mode: '0644'
    owner: "{{ real_user }}"
  when: deploy_universal_agents_md | bool
  become: yes

- name: Create global Aider config ~/.aider.conf.yml
  template:
    src: aider.conf.yml.j2
    dest: "{{ real_user_home }}/.aider.conf.yml"
    mode: '0644'
    owner: "{{ real_user }}"
  when: install_aider_venv | bool
  become: yes

- name: Configure Gemini CLI / MCP extensions (~/.gemini/settings.json)
  template:
    src: gemini_settings.json.j2
    dest: "{{ real_user_home }}/.gemini/settings.json"
    mode: '0644'
    owner: "{{ real_user }}"
  become: yes

- name: Configure OpenCode settings (~/.config/opencode/opencode.json)
  template:
    src: opencode.json.j2
    dest: "{{ real_user_home }}/.config/opencode/opencode.json"
    mode: '0644'
    owner: "{{ real_user }}"
  when: configure_opencode | bool
  become: yes

- name: Configure Claude Code settings (~/.claude.json)
  template:
    src: claude_config.json.j2
    dest: "{{ real_user_home }}/.claude.json"
    mode: '0644'
    owner: "{{ real_user }}"
  when: configure_claude_code | bool
  become: yes

- name: Configure Shell-GPT settings (~/.config/shell_gpt/.sgptrc)
  template:
    src: sgptrc.j2
    dest: "{{ real_user_home }}/.config/shell_gpt/.sgptrc"
    mode: '0644'
    owner: "{{ real_user }}"
  when: configure_shell_gpt | bool
  become: yes


- name: Install Kimi Code (Terminal AI assistant)
  shell: curl -fsSL https://code.kimi.com/kimi-code/install.sh | KIMI_INSTALL_DIR=/usr/local bash
  when: install_kimi_code | bool
  args:
    creates: /usr/local/bin/kimi
  become: yes

- name: Install Ollama (Local LLM runner)
  shell: curl -fsSL https://ollama.com/install.sh | sh
  when: install_ollama | bool
  args:
    creates: /usr/local/bin/ollama
  become: yes

- name: Pull requested local AI models
  command: "ollama pull {{ item }}"
  loop: "{{ ollama_models }}"
  when: install_ollama | bool
  register: ollama_pull
  changed_when: "'pulling' in ollama_pull.stdout"

