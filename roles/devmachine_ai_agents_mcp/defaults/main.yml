---
# ==============================================================================
# Defaults for devmachine_ai_agents_mcp role
# Configures AI agents on the machine to use MCP (Model Context Protocol) servers,
# starting with the GitHub MCP server configured with GITHUB_PERSONAL_ACCESS_TOKEN.
# ==============================================================================

# Search paths for .env file (checked in order)
mcp_dotenv_paths:
  - "{{ playbook_dir }}/../.env"
  - "{{ playbook_dir }}/.env"
  - "{{ inventory_dir }}/../.env"
  - "{{ inventory_dir }}/.env"
  - "./.env"

# Explicit fallback for GitHub Personal Access Token (if not provided, loaded from .env)
github_personal_access_token: ""

# MCP NPM packages to install globally
mcp_npm_packages:
  - "@modelcontextprotocol/server-github"
  - "@modelcontextprotocol/server-google-maps"
  - "@modelcontextprotocol/server-brave-search"
  - "mcp-server-fetch-typescript"
  - "@modelcontextprotocol/server-sequential-thinking"

# Client integration toggles
configure_gemini_mcp: true
configure_claude_desktop_mcp: true
configure_claude_code_mcp: true
configure_vscode_cline_mcp: true
configure_opencode_mcp: true
configure_shell_env_mcp: true

# Client settings
claude_code_auto_updater_status: "enabled"
opencode_default_model: "openrouter/anthropic/claude-3.5-sonnet"
opencode_theme: "auto"
openrouter_api_key: ""

# Additional MCP server configuration placeholders
google_maps_mcp_key: ""
brave_search_mcp_key: ""

# ai-memory Persistent Memory MCP Server
configure_ai_memory_mcp: true
ai_memory_server_url: "http://127.0.0.1:49374/mcp"
