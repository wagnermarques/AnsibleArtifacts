---
- name: Install virtualization packages (Fedora / RedHat)
  dnf:
    name: "{{ virtualization_packages_fedora }}"
    state: present
  become: yes
  when: ansible_facts['os_family'] == "RedHat"

- name: Install virtualization packages (Debian / Ubuntu)
  apt:
    name: "{{ virtualization_packages_debian }}"
    state: present
    update_cache: yes
  become: yes
  when: ansible_facts['os_family'] == "Debian"

- name: Start and enable libvirtd service
  service:
    name: libvirtd
    state: started
    enabled: yes
  become: yes
  when: ansible_facts['os_family'] in ['RedHat', 'Debian']

- name: Add user to libvirt group
  user:
    name: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    groups: libvirt
    append: yes
  become: yes
  when: ansible_facts['os_family'] in ['RedHat', 'Debian']

# --- Firewalld configuration (Fedora / RedHat) ---
- name: Ensure masquerade is enabled in firewalld libvirt zone
  ansible.posix.firewalld:
    zone: libvirt
    masquerade: yes
    permanent: yes
    state: enabled
    immediate: yes
  become: yes
  when: ansible_facts['os_family'] == "RedHat"
  ignore_errors: yes

- name: Enable forward on firewalld libvirt zone
  command: firewall-cmd --zone=libvirt --add-forward --permanent
  register: firewall_forward_cmd
  changed_when: "'ALREADY_ENABLED' not in firewall_forward_cmd.stderr"
  failed_when: false
  become: yes
  when: ansible_facts['os_family'] == "RedHat"

- name: Reload firewalld if forward rule was added
  command: firewall-cmd --reload
  become: yes
  when:
    - ansible_facts['os_family'] == "RedHat"
    - firewall_forward_cmd is changed

# --- Docker network coexistence ---
- name: Check if DOCKER-USER iptables chain exists
  command: iptables -L DOCKER-USER -n
  register: docker_user_chain_check
  changed_when: false
  failed_when: false
  become: yes

- name: Allow Libvirt incoming traffic in DOCKER-USER chain (Fix Docker conflict)
  iptables:
    chain: DOCKER-USER
    in_interface: virbr0
    jump: ACCEPT
    action: insert
    rule_num: 1
    state: present
  become: yes
  when: docker_user_chain_check.rc == 0

- name: Allow Libvirt outgoing traffic in DOCKER-USER chain (Fix Docker conflict)
  iptables:
    chain: DOCKER-USER
    out_interface: virbr0
    jump: ACCEPT
    action: insert
    rule_num: 1
    state: present
  become: yes
  when: docker_user_chain_check.rc == 0

