---
- name: Get the actual user and home directory
  set_fact:
    real_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"
    real_user_home: "{{ ansible_facts['env']['HOME'] if ansible_facts['env']['SUDO_USER'] is not defined else '/home/' + ansible_facts['env']['SUDO_USER'] }}"
  tags: [always]

- name: Install Emacs build dependencies
  dnf:
    name: "{{ emacs_fedora_deps }}"
    state: present
  become: yes

- name: Create Emacs installation directory
  file:
    path: "{{ emacs_install_dir }}"
    state: directory
    owner: "{{ tools_owner | default(real_user) }}"
    mode: '0755'
  become: yes

- name: Clone Emacs source repository
  git:
    repo: "{{ emacs_repo_url }}"
    dest: "{{ emacs_source_dir }}"
    version: "{{ emacs_version }}"
    depth: 1
  become: no

- name: Build and Install Emacs
  shell: |
    ./autogen.sh
    ./configure {{ emacs_configure_flags }}
    make -j$(nproc)
    make install
  args:
    chdir: "{{ emacs_source_dir }}"
    creates: "{{ emacs_install_dir }}/bin/emacs"
  become: no

- name: Clone fzl-emacs configuration into isolated directory
  git:
    repo: "{{ emacs_config_repo }}"
    dest: "{{ emacs_config_dir }}"
    version: "{{ emacs_config_branch }}"
    force: yes
  become: no

- name: Create fzl-emacs executable command wrapper in /usr/local/bin
  template:
    src: fzl-emacs.j2
    dest: /usr/local/bin/fzl-emacs
    mode: '0755'
  become: yes

- name: Create fzl-emacs-start executable launcher in /usr/local/bin
  template:
    src: fzl-emacs-start.j2
    dest: /usr/local/bin/fzl-emacs-start
    mode: '0755'
  become: yes

- name: Create fzl-emacsclient executable command wrapper in /usr/local/bin
  template:
    src: fzl-emacsclient.j2
    dest: /usr/local/bin/fzl-emacsclient
    mode: '0755'
  become: yes

- name: Create FZL Emacs desktop launcher entry
  template:
    src: fzl-emacs.desktop.j2
    dest: /usr/share/applications/fzl-emacs.desktop
    mode: '0644'
  become: yes

- name: Create shell integration for Emacs
  template:
    src: bashrc_emacs.j2
    dest: "{{ real_user_home }}/.bashrc_emacs"
    mode: '0644'
  become: no

- name: Source Emacs in .bashrc
  lineinfile:
    path: "{{ real_user_home }}/.bashrc"
    line: "source ~/.bashrc_emacs"
    state: present
  become: no
